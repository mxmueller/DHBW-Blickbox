version: '3.6'
services:
  sops:
    image: mozilla/sops:latest
    user: "${UID}:${GID}"
    volumes:
      - "./secrets:/secrets"
    environment:
      - SOPS_AGE_KEY_FILE=/secrets/key.txt
    command: >
      sh -c "sops --config /secrets/.sops.yaml --decrypt /secrets/secrets.prod.enc.env
      > /secrets/secrets.prod.env && chmod 600 /secrets/secrets.prod.env"
  valentin:
      ports:
        - "3001:80" 
      build:
        context: ./client/valentin
        dockerfile: Dockerfile
      restart: always 
  python_app:
    build:
      context: ./deployment/
      dockerfile: Dockerfile
    networks:
      - redis_net
    restart: always
    ports:
      - "3002:5000" 
    links: 
      - influxdb
    depends_on:
      - influxdb
  influxdb:
    image: influxdb:1.8.10-alpine
    container_name: influxdb
    restart: always
    env_file:
        - path: ./secrets/secrets.prod.env
          required: false
    volumes:
      - /srv/blickbox/influx:/var/lib/influxdb:uid=1000,gid=1000
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-server
    restart: always
    env_file:
        - path: ./secrets/secrets.prod.env
          required: false  
    links: 
      - influxdb
    depends_on:
      - influxdb
    ports:
      - "3000:3000" 
    volumes:
      - /srv/blickbox/grafana_data:/var/lib/grafana:rw
  blickbox_redis:
    image: redis:7-alpine
    restart: always
    networks:
        redis_net: {}
        app_net:
          ipv4_address: 172.16.238.10
    env_file:
        - path: ./secrets/secrets.prod.env
          required: false 
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
  
  redis_microservice:
    build:
      context: ./deployment/redis_microservice
      dockerfile: Dockerfile
    restart: always
    networks:
      - redis_net
    env_file:
      - path: ./secrets/secrets.prod.env
        required: false
    ports:
      - "3004:5001"
  
volumes:
  grafana_data:
  influxdb_data:  
  data:
  letsencrypt:
networks:
  app_net:
    ipam:
      config:
        - subnet: 172.16.238.0/24
  redis_net:
    driver: bridge
