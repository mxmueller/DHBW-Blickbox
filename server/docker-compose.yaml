version: '3.6'

services:

  sops:
    image: mozilla/sops:latest
    volumes:
      - "./secrets:/secrets"
    environment:
      SOPS_AGE_KEY_FILE: /secrets/key.txt
    command: >
      sh -c "sops --config /secrets/.sops.yaml --decrypt /secrets/secrets.dev.enc.env
      > /secrets/secrets.dev.env && chmod 600 /secrets/secrets.dev.env"
      
  valentin: 
    build:
      context: ./client/valentin
      dockerfile: Dockerfile
    restart: always 

  python_app:
    build:
      context: ./deployment/
      dockerfile: Dockerfile
    restart: always
    links: 
      - influxdb
    depends_on:
      - influxdb

  redis_microservice:
    build:
      context: ./deployment/redis_microservice
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./deployment/redis_microservice/logdaten:/app/logdaten
    depends_on:
      - redis

  influxdb:
    image: influxdb:1.8.10-alpine
    container_name: influxdb
    restart: always
    env_file:
        - path: ./secrets/secrets.dev.env
          required: false
    volumes:
      - influxdb_data:/var/lib/influxdb
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-server
    restart: always
    env_file:
        - path: ./secrets/secrets.dev.env
          required: false  
    links: 
      - influxdb
    depends_on:
      - influxdb
    ports:
      - "3000:3000" 
    volumes:
      - grafana_data:/var/lib/grafana

  reverse-proxy:
    image: 'docker.io/jc21/nginx-proxy-manager:latest'
    restart: unless-stopped

    ports:
      # These ports are in format <host-port>:<container-port>
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81' # Admin Web Port
      # Add any other Stream port you want to expose
      # - '21:21' # FTP

    # Uncomment the next line if you uncomment anything in the section
    # environment:
      # Uncomment this if you want to change the location of
      # the SQLite DB file within the container
      # DB_SQLITE_FILE: "/data/database.sqlite"

      # Uncomment this if IPv6 is not enabled on your host
      # DISABLE_IPV6: 'true'

    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    env_file:
        - path: ./secrets/secrets.dev.env
          required: false 
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}" ]

  redis-insight:
    image: redis/redisinsight:latest
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redis-insight:/data


volumes:
  grafana_data:
  influxdb_data:  
  data:
  letsencrypt:
  redis-insight:


